name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install PWABuilder
        run: npm install -g pwabuilder
      
      - name: Build APK
        run: |
          mkdir -p output
          pwabuilder package --url https://new676.github.io/Farm-attendance/ --output output/ --platform android
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farm-apk
          path: ./output/*.apk
